<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · EduSphere</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            color: #0F172A;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 420px;
            background: #fff;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 12px 32px rgba(15,23,42,.08);
        }
        .logo {
            width: 64px; height: 64px;
            margin: 0 auto 20px;
            display: grid; place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #1D4ED8, #7C3AED);
            color: #fff;
            font-size: 28px; font-weight: 800;
        }
        h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: -.02em; }
        p { color: #64748B; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .signal { color: #D97706; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #D97706; animation: pulse 1.6s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
        .note { font-size: 12px; color: #94A3B8; margin-top: 20px; }
        button {
            margin-top: 16px;
            border: none;
            background: #1D4ED8;
            color: #fff;
            font-size: 14px; font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
        }
        button:hover { background: #1E40AF; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">E</div>
        <h1>You're offline</h1>
        <p>EduSphere is a progressive web app. Attendance you record now will be saved on this device and automatically synced when the connection returns.</p>
        <div class="signal"><span class="dot"></span> Waiting for network…</div>
        <button onclick="location.reload()">Try again</button>
        <div class="note">EduSphere · School Management System</div>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
